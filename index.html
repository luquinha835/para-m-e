<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Para Minha Mãe ❤️</title>

<style>
body{
    margin:0;
    font-family:Arial, Helvetica, sans-serif;
    background:linear-gradient(135deg,#ff9a9e,#fad0c4);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    overflow:hidden;
}

.container{
    background:white;
    padding:40px;
    border-radius:20px;
    text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,0.2);
}

h1{
    color:#ff4b6e;
    font-size:40px;
}

p{
    font-size:20px;
}

button{
    background:#ff4b6e;
    color:white;
    border:none;
    padding:15px 25px;
    font-size:18px;
    border-radius:10px;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    background:#ff1e4d;
    transform:scale(1.1);
}

.heart{
    position:absolute;
    color:#ff4b6e;
    animation:float 6s linear infinite;
}

@keyframes float{
    from{
        transform:translateY(100vh);
        opacity:1;
    }
    to{
        transform:translateY(-10vh);
        opacity:0;
    }
}
</style>
</head>

<body>

<div class="container">
<h1>❤️ Mãe ❤️</h1>

<p>
Mãe, obrigado por tudo que você faz por mim.<br>
Você é a melhor mãe do mundo! 🌎💖
</p>

<button onclick="surpresa()">Clique para uma surpresa</button>

</div>

<script>

function surpresa(){
    alert("Eu te amo muito mãe! ❤️");
}

function criarCoracao(){
    const heart = document.createElement("div");
    heart.classList.add("heart");
    heart.innerHTML = "❤️";
    heart.style.left = Math.random()*100 + "vw";
    heart.style.fontSize = (20 + Math.random()*30) + "px";

    document.body.appendChild(heart);

    setTimeout(()=>{
        heart.remove();
    },6000);
}

setInterval(criarCoracao,500);

</script>

</body>
</html>
